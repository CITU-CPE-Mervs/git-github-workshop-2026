<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Class Hub</h1>
    <p>One page, many widgets. Each one built by a different person.</p>
  </header>

  <main id="widgets">
    <!-- Example widget (do not delete) -->
    <section class="widget">
      <h2>Click Counter (example)</h2>
      <div id="example-widget"></div>
    </section>

    <!-- ADD YOUR WIDGET SECTION BELOW THIS LINE -->
     
<section class="widget">
  <h2>RPG Dice Roller</h2>
  <div id="compra-widget"></div>
</section>

    <section class="widget">
      <h2>My To-Do List</h2>
      <div id="todo-widget">
        <input
          type="text"
          id="todo-input"
          placeholder="Enter a task..."
        >
        <button id="add-task">Add Task</button>
        <ul id="todo-list"></ul>
      </div>
    </section>


  </main>

  <!-- Example script (do not delete) -->
  <script src="widgets/example.js"></script>

  <!-- ADD YOUR SCRIPT TAG BELOW THIS LINE -->
   <script src="widgets/todo.js"></script>
   <script src="widgets/comprar1.js"></script>

</body>
</html>
